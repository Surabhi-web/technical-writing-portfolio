<h1>Search the Knowledge Base</h1>
<p>Search the Knowledge Base before submitting a ticket to find solutions for common issues.</p>
<ol>
<li>Select <strong>Knowledge Base</strong>.</li>
<li>Enter one or more keywords describing the issue.</li>
<li>Select <strong>Search</strong>.</li>
<li>Open an article that matches your issue.</li>
</ol>
